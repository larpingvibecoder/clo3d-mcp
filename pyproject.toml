[project]
name = "clo3d-mcp"
version = "0.1.0a1"
description = "Experimental local MCP integration for CLO garment workflows on macOS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: MacOS :: MacOS X", "Programming Language :: Python :: 3"]
requires-python = ">=3.11"
dependencies = ["mcp>=2.2.0,<3", "anyio>=4,<5"]

[project.scripts]
clo3d-mcp = "clo3d_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clo3d_mcp"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[project.optional-dependencies]
macos = ["pyobjc-framework-ApplicationServices>=11; sys_platform == 'darwin'", "pyobjc-framework-Quartz>=11; sys_platform == 'darwin'", "pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'"]

[tool.hatch.build.targets.wheel.force-include]
"bridge" = "clo3d_mcp/_bridge"

[tool.hatch.build.targets.sdist]
include = ["/src", "/bridge", "/tests", "/scripts", "/docs", "/examples", "/README.md", "/LICENSE", "/CHANGELOG.md", "/SECURITY.md", "/CONTRIBUTING.md", "/THIRD_PARTY_NOTICES.md", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build]
dev-mode-dirs = ["src"]
