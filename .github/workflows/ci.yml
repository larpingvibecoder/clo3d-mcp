name: Package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --no-editable --locked --python ${{ matrix.python }}
      - run: uv run --no-editable pytest -q
      - run: uv run --no-editable python tests/smoke_stdio.py
      - run: uv build
      - if: matrix.python == '3.12'
        run: uv run --no-editable python scripts/check_wheel.py
